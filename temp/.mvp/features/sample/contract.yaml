feature: sample
goal: >-
  Provide a contract-first starter feature that proves Dream's Kotlin Multiplatform
  architecture with local create, read, and update behavior backed by Room.
entities:
  SampleItem:
    id: stable string identifier
    title: user-entered text or stable starter content key resolved in presentation
    description: user-entered text or stable starter content key resolved in presentation
    category: Contract | Architecture | Preview
    occurredAtMillis: creation timestamp in epoch milliseconds from TimeProvider.nowMillis()
    updatedAtMillis: last update timestamp in epoch milliseconds from TimeProvider.nowMillis()
actions:
  - Load: read starter and user-created items from local Room storage
  - SelectItem: open a detail state for an item and emit detail navigation
  - StartCreate: show an editable form with blank fields
  - StartEdit: show editable fields for the selected detail item
  - TitleChanged: update title input and clear title validation
  - DescriptionChanged: update description input and clear description validation
  - CategoryChanged: update category selection
  - Save: validate required fields, then create or update the item
  - CancelEdit: return to read-only detail state without validation errors
screens:
  list:
    states:
      loading: preparing starter project card
      empty: no starter cards available
      content: starter and user-created item cards
      error: retryable starter-content error card
  detail:
    states:
      read: title, description, category, and Occurred row rendered for selected item
      edit: compact editable title, description, category chips, save, and cancel actions
  create:
    states:
      edit: blank form opened from Add action and saved into local Room storage
validation:
  - title is required and trimmed before persistence
  - description is required and trimmed before persistence
  - save marks blank field errors without calling the repository
timeBehavior:
  - repository creation uses TimeProvider.nowMillis() for occurredAtMillis and updatedAtMillis
  - repository update uses TimeProvider.nowMillis() for updatedAtMillis
  - presentation maps occurredAtMillis with TimeProvider.formatDate(...)
storage:
  type: local-room
  seedBehavior: stores stable starter content keys in data; presentation resolves them through shared string resources
  userEnteredBehavior: create and update preserve raw user-entered title and description text
requiredTests:
  domain:
    - SampleItem preserves identity, category, occurredAtMillis, and updatedAtMillis
    - update trims editable fields and preserves occurredAtMillis
    - repository contract returns Result-wrapped read/create/update domain items
  data:
    - entity/domain mapper preserves fields and category fallback
    - RoomSampleRepository seeds local Room data when empty
    - create uses FakeTimeProvider current time and trims input
    - update uses FakeTimeProvider current time and preserves existing position
  presentation:
    - loading, content, detail navigation, validation, create, update, and error states
    - TimeProvider.formatDate(...) supplies occurred labels
maestroExpectations:
  android:
    - launch app, read starter list, create an item, open/edit detail, assert updated content and Occurred row
  ios:
    - same create/read/detail/update coverage with pressKey: Enter fallback for single-line text entry
