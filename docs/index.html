<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Flow — Building Faster Without Building Worse</title>
<style>
  :root {
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface-2: #e4e7ee;
    --ink: #1a2130;
    --ink-dim: #5a6478;
    --accent: #b8701f;
    --accent-ink: #6e4210;
    --good: #256b5b;
    --good-bg: #dcece6;
    --bad: #9a3a26;
    --bad-bg: #f3ddd6;
    --border: #ccd1dc;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #12151d;
    --surface: #1a1f2a;
    --surface-2: #232937;
    --ink: #e8eaf0;
    --ink-dim: #99a1b5;
    --accent: #e3a15c;
    --accent-ink: #f6d3a3;
    --good: #5fb39f;
    --good-bg: #1c332e;
    --bad: #e0876c;
    --bad-bg: #3a2420;
    --border: #2e3648;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151d;
      --surface: #1a1f2a;
      --surface-2: #232937;
      --ink: #e8eaf0;
      --ink-dim: #99a1b5;
      --accent: #e3a15c;
      --accent-ink: #f6d3a3;
      --good: #5fb39f;
      --good-bg: #1c332e;
      --bad: #e0876c;
      --bad-bg: #3a2420;
      --border: #2e3648;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }
  body { min-height: 100vh; }

  .deck {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  .rail {
    position: fixed;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 20;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .rail-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .rail-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .rail-item.active { color: var(--accent); }
  .rail-item.active .rail-dot { background: var(--accent); width: 8px; height: 8px; }
  @media (max-width: 860px) { .rail { display: none; } }

  .progress-bar {
    position: fixed; top: 0; left: 0; height: 3px;
    background: var(--accent);
    z-index: 30;
    transition: width 0.35s ease;
  }
  @media (prefers-reduced-motion: reduce) { .progress-bar { transition: none; } }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: 7vh 11vw 8vh 11vw;
    opacity: 0;
  }
  .slide.active {
    display: flex;
    opacity: 1;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } }

  @media (max-width: 860px) {
    .slide { padding: 8vh 7vw 12vh 7vw; }
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: auto;
    flex: 0 0 auto;
  }
  .kicker b { color: var(--accent); font-weight: 600; }

  .slide-body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: safe center;
    min-height: 0;
    min-width: 0;
    overflow-y: auto;
    padding: 2vh 0;
  }

  h1.title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(2.6rem, 6vw, 4.4rem);
    line-height: 1.05;
    margin: 0 0 0.5em 0;
    text-wrap: balance;
    max-width: 15ch;
  }
  .subtitle {
    font-size: clamp(1.05rem, 1.6vw, 1.3rem);
    color: var(--ink-dim);
    max-width: 46ch;
    line-height: 1.5;
  }
  .meta-line {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2.5em;
    letter-spacing: 0.03em;
  }

  h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.9rem, 3.6vw, 2.7rem);
    line-height: 1.15;
    margin: 0 0 0.7em 0;
    text-wrap: balance;
    max-width: 22ch;
  }

  .statement {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.8rem, 3.4vw, 2.6rem);
    line-height: 1.28;
    max-width: 20ch;
    text-wrap: balance;
  }
  .statement-sub {
    margin-top: 1em;
    font-size: clamp(1.02rem, 1.4vw, 1.2rem);
    color: var(--ink-dim);
    max-width: 48ch;
    line-height: 1.55;
  }

  p.lede {
    font-size: clamp(1rem, 1.4vw, 1.18rem);
    line-height: 1.62;
    max-width: 62ch;
    color: var(--ink);
  }
  p.lede + p.lede { margin-top: 0.9em; }

  .checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.1em; max-width: 62ch; }
  .checklist li {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 12px;
    font-size: 1.02rem;
    line-height: 1.5;
  }
  .checklist li::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    margin-top: 0.55em;
  }
  .checklist b { font-weight: 600; }
  .checklist .dim { color: var(--ink-dim); }

  .anti-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.85em; max-width: 68ch; }
  .anti-list li {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--ink);
    padding: 0.15em 0 0.15em 1.6em;
    position: relative;
  }
  .anti-list li::before {
    content: "×";
    position: absolute; left: 0; top: 0.1em;
    color: var(--bad);
    font-weight: 700;
    font-family: var(--font-body);
  }
  .anti-list code { color: var(--accent-ink); }

  table.deck-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.95rem;
  }
  table.deck-table th, table.deck-table td {
    text-align: left;
    padding: 0.65em 1em 0.65em 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.45;
  }
  table.deck-table th {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 500;
  }
  table.deck-table td code, table.deck-table td.mono { font-family: var(--font-mono); font-size: 0.88em; }
  .table-wrap { overflow-x: auto; max-width: 100%; }

  .quote-block {
    border-left: 3px solid var(--accent);
    padding: 0.2em 0 0.2em 1.4em;
    max-width: 60ch;
  }
  .quote-block p {
    font-family: var(--font-display);
    font-style: italic;
    font-size: clamp(1.05rem, 1.6vw, 1.35rem);
    line-height: 1.5;
    margin: 0;
  }
  .cite {
    display: block;
    margin-top: 0.9em;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  .pill-row { display: flex; flex-wrap: wrap; gap: 0.6em; }
  .pill {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 0.35em 0.85em;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .pill.accent { border-color: var(--accent); color: var(--accent-ink); }
  .pill.good { border-color: var(--good); color: var(--good); background: var(--good-bg); }
  .pill.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }

  .code-block {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    line-height: 1.55;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1em 1.2em;
    overflow-x: auto;
    white-space: pre;
  }
  .code-block.minus { border-left: 3px solid var(--bad); background: var(--bad-bg); }
  .code-block.plus { border-left: 3px solid var(--good); background: var(--good-bg); }
  .code-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4em; max-width: 78ch; }
  @media (max-width: 860px) { .code-pair { grid-template-columns: 1fr; } }
  .code-label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.5em; }
  .code-label.minus { color: var(--bad); }
  .code-label.plus { color: var(--good); }
  .file-path { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-dim); margin-bottom: 1.1em; word-break: break-all; }

  figure.diagram { margin: 0.4em 0 0 0; max-width: 100%; min-width: 0; }
  figure.diagram svg { width: 100%; height: auto; max-width: 760px; display: block; color: var(--ink); }
  figure.diagram figcaption { margin-top: 0.9em; font-size: 0.92rem; color: var(--ink-dim); max-width: 56ch; line-height: 1.5; }
  .dg-node rect, .dg-node { fill: var(--surface); stroke: var(--ink-dim); stroke-width: 1.5; }
  .dg-node-accent { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
  .dg-text { fill: var(--ink); font-family: var(--font-mono); font-size: 12.5px; }
  .dg-text-dim { fill: var(--ink-dim); font-family: var(--font-mono); font-size: 10.5px; }
  .dg-text-accent { fill: var(--accent-ink); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; }
  .dg-arrow { stroke: var(--ink-dim); stroke-width: 1.5; fill: none; }
  .dg-arrow-accent { stroke: var(--accent); stroke-width: 1.5; fill: none; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 3em; max-width: 76ch; }
  @media (max-width: 860px) { .two-col { grid-template-columns: 1fr; gap: 1.6em; } }
  .col h3 { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 0.9em 0; }

  .footer-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .nav-buttons {
    position: fixed;
    bottom: 24px;
    right: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 25;
  }
  .nav-counter {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .nav-buttons-group { display: flex; gap: 10px; }
  .nav-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .click-zone { position: fixed; top: 0; bottom: 0; width: 18%; z-index: 15; cursor: pointer; }
  .click-zone.left { left: 0; }
  .click-zone.right { right: 0; }
  @media (max-width: 860px) { .click-zone { display: none; } }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar" style="width: 0%"></div>

<nav class="rail" id="rail" aria-hidden="true"></nav>

<div class="deck" id="deck" role="region" aria-label="Slide deck" tabindex="0"></div>

<div class="click-zone left" id="zoneLeft" aria-hidden="true"></div>
<div class="click-zone right" id="zoneRight" aria-hidden="true"></div>

<div class="nav-buttons">
  <span class="nav-counter" id="navCounter">01 / 28</span>
  <div class="nav-buttons-group">
    <button class="nav-btn" id="prevBtn" aria-label="Previous slide">‹</button>
    <button class="nav-btn" id="nextBtn" aria-label="Next slide">›</button>
  </div>
</div>

<script>
(function () {
  var SECTIONS = {
    A: "Foundations",
    B: "The Flow",
    C: "Dream, In This Repo",
    D: "Why AI Defaults To Bad Code",
    E: "The Knowledge System",
    F: "AI Testing AI",
    G: "Learning From Mistakes",
    H: "Takeaways"
  };

  function kicker(letter) {
    return '<div class="kicker"><b>' + letter + '</b> — ' + SECTIONS[letter].toUpperCase() + '</div>';
  }

  var slides = [];

  // ---------- A. FOUNDATIONS ----------

  slides.push({ section: 'A', html:
    '<div class="slide-body">' +
      '<h1 class="title">Building Faster Without Building Worse</h1>' +
      '<p class="subtitle">How a structured AI flow — not a bigger prompt — is how we scale AI-assisted development.</p>' +
      '<div class="meta-line">AI FLOW · 12 August 2026</div>' +
    '</div>'
  });

  slides.push({ section: 'A', html:
    '<div class="slide-body">' +
      '<p class="statement">A single prompt can produce code that looks finished — and is checked by nothing but our own eyes.</p>' +
      '<p class="statement-sub">That gap between "looks done" and "is verified" is exactly where AI-assisted work gets a bad reputation. An AI flow closes that gap without giving back the speed.</p>' +
    '</div>'
  });

  slides.push({ section: 'A', html:
    '<div class="slide-body">' +
      '<h2>What is an agent?</h2>' +
      '<p class="lede">An LLM given tools, a goal, and a loop — not just a single reply. It plans a step, calls a tool, looks at what actually happened, and decides the next step. A prompt returns text once; an agent keeps going until the goal is met.</p>' +
      '<figure class="diagram">' +
        '<svg viewBox="0 0 640 300" role="img" aria-label="An agent loops through plan, act, and observe, feeding each result back into the next plan, driven by a goal.">' +
          '<defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--ink-dim)"/></marker></defs>' +
          '<text x="320" y="26" class="dg-text-dim" text-anchor="middle">GOAL</text>' +
          '<line x1="320" y1="34" x2="320" y2="64" class="dg-arrow" marker-end="url(#a1)"/>' +
          '<rect x="240" y="66" width="160" height="52" rx="10" class="dg-node"/>' +
          '<text x="320" y="97" class="dg-text" text-anchor="middle">Plan</text>' +
          '<path d="M 388 110 C 460 140, 490 160, 505 180" class="dg-arrow" marker-end="url(#a1)" fill="none"/>' +
          '<rect x="440" y="182" width="150" height="52" rx="10" class="dg-node"/>' +
          '<text x="515" y="213" class="dg-text" text-anchor="middle">Act (tool call)</text>' +
          '<line x1="440" y1="208" x2="200" y2="208" class="dg-arrow" marker-end="url(#a1)"/>' +
          '<rect x="50" y="182" width="150" height="52" rx="10" class="dg-node"/>' +
          '<text x="125" y="213" class="dg-text" text-anchor="middle">Observe</text>' +
          '<path d="M 135 182 C 150 150, 200 125, 250 116" class="dg-arrow" marker-end="url(#a1)" fill="none"/>' +
        '</svg>' +
        '<figcaption>Plan → act → observe → plan again. Prompting is one box on this diagram: a single Act with no Observe and no way back in.</figcaption>' +
      '</figure>' +
    '</div>'
  });

  // ---------- B. THE FLOW ----------

  slides.push({ section: 'B', html:
    '<div class="slide-body">' +
      '<h2>One agent isn\'t enough for real work</h2>' +
      '<p class="lede">A single agent juggling an entire feature drifts: it forgets earlier constraints, blurs layers together, and reviews its own work with the same blind spots that wrote it. A flow gives each concern to a specialist and makes the handoff between them explicit.</p>' +
      '<figure class="diagram">' +
        '<svg viewBox="0 0 700 300" role="img" aria-label="An orchestrator agent delegates to five specialist agents: discovery, design, implement, test, and review.">' +
          '<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--ink-dim)"/></marker></defs>' +
          '<rect x="270" y="16" width="160" height="52" rx="10" class="dg-node-accent"/>' +
          '<text x="350" y="47" class="dg-text-accent" text-anchor="middle">orchestrator</text>' +
          '<text x="350" y="88" class="dg-text-dim" text-anchor="middle">delegates →</text>' +
          (function(){
            var labels = ['discovery','design','implement','test','review'];
            var out = '';
            for (var i=0;i<5;i++) {
              var x = 20 + i*136;
              out += '<path d="M 350 70 L ' + (x+60) + ' 190" class="dg-arrow" marker-end="url(#a2)"/>';
              out += '<rect x="' + x + '" y="192" width="120" height="52" rx="10" class="dg-node"/>';
              out += '<text x="' + (x+60) + '" y="223" class="dg-text" text-anchor="middle">' + labels[i] + '</text>';
            }
            return out;
          })() +
        '</svg>' +
        '<figcaption>dream-general never edits code itself — it interprets the request and routes each phase to the agent built for it.</figcaption>' +
      '</figure>' +
    '</div>'
  });

  slides.push({ section: 'B', html:
    '<div class="slide-body">' +
      '<h2>Anatomy of a flow</h2>' +
      '<ul class="checklist">' +
        '<li><span><b>Phases</b> — plan, build, verify, review, each with a clear exit condition, <span class="dim">not "keep going until it feels done."</span></span></li>' +
        '<li><span><b>Handoffs</b> — one agent\'s output is the next agent\'s input, <span class="dim">nothing carried as unwritten shared context.</span></span></li>' +
        '<li><span><b>Artifacts as contracts</b> — a spec file, a contract file, a report, <span class="dim">not a conversation you\'d have to re-read to reconstruct intent.</span></span></li>' +
        '<li><span><b>Gates</b> — a phase can\'t be marked done by the agent that did the work, <span class="dim">only by the one that checks it.</span></span></li>' +
      '</ul>' +
    '</div>'
  });

  slides.push({ section: 'B', html:
    '<div class="slide-body">' +
      '<h2>Prompting vs. a flow</h2>' +
      '<div class="table-wrap"><table class="deck-table">' +
        '<tr><th></th><th>Just prompting</th><th>An AI flow</th></tr>' +
        '<tr><td>Context</td><td>One giant, decaying context</td><td>Small, focused context per stage</td></tr>' +
        '<tr><td>Verification</td><td>Self-reported — "looks right"</td><td>A separate agent checks the work</td></tr>' +
        '<tr><td>Division of labor</td><td>One generalist doing everything</td><td>Specialists matched to each concern</td></tr>' +
        '<tr><td>Repeatability</td><td>A different result each time you ask</td><td>Same phases, same checks, every time</td></tr>' +
        '<tr><td>Failure mode</td><td>Silent — ships until someone notices</td><td>Loud — a gate blocks the handoff</td></tr>' +
      '</table></div>' +
    '</div>'
  });

  slides.push({ section: 'B', html:
    '<div class="slide-body">' +
      '<h2>The shape of a flow</h2>' +
      '<figure class="diagram">' +
        '<svg viewBox="0 0 960 260" role="img" aria-label="Plan flows into build, into verify, into a review gate, which either approves to ship or rejects back to build for repair.">' +
          '<defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--ink-dim)"/></marker>' +
          '<marker id="a3b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="var(--accent)"/></marker></defs>' +
          '<rect x="45" y="102" width="130" height="56" rx="10" class="dg-node"/><text x="110" y="135" class="dg-text" text-anchor="middle">Plan</text>' +
          '<line x1="175" y1="130" x2="215" y2="130" class="dg-arrow" marker-end="url(#a3)"/>' +
          '<rect x="220" y="102" width="130" height="56" rx="10" class="dg-node"/><text x="285" y="135" class="dg-text" text-anchor="middle">Build</text>' +
          '<line x1="350" y1="130" x2="390" y2="130" class="dg-arrow" marker-end="url(#a3)"/>' +
          '<rect x="395" y="102" width="130" height="56" rx="10" class="dg-node"/><text x="460" y="135" class="dg-text" text-anchor="middle">Verify</text>' +
          '<line x1="525" y1="130" x2="565" y2="130" class="dg-arrow" marker-end="url(#a3)"/>' +
          '<polygon points="660,80 740,130 660,180 580,130" class="dg-node-accent"/>' +
          '<text x="660" y="126" class="dg-text-accent" text-anchor="middle">Review</text>' +

      '</ul>' +

  // ---------- RENDER ----------

  var deck = document.getElementById('deck');
  var rail = document.getElementById('rail');
  var progressBar = document.getElementById('progressBar');
  var current = 0;

  slides.forEach(function (s, i) {
    var el = document.createElement('section');
    el.className = 'slide';
    el.setAttribute('data-index', i);
    el.innerHTML = kicker(s.section) + s.html +
      '<div class="footer-row"><span>' + SECTIONS[s.section] + '</span></div>';
    deck.appendChild(el);
  });

  var letters = Object.keys(SECTIONS);
  letters.forEach(function (letter) {
    var item = document.createElement('div');
    item.className = 'rail-item';
    item.setAttribute('data-letter', letter);
    item.innerHTML = '<span class="rail-dot"></span><span>' + letter + '</span>';
    rail.appendChild(item);
  });

  var slideEls = deck.querySelectorAll('.slide');
  var railEls = rail.querySelectorAll('.rail-item');

  function show(i) {
    if (i < 0 || i >= slides.length) return;
    slideEls[current].classList.remove('active');
    current = i;
    slideEls[current].classList.add('active');
    progressBar.style.width = ((current + 1) / slides.length * 100) + '%';
    var activeLetter = slides[current].section;
    railEls.forEach(function (r) {
      r.classList.toggle('active', r.getAttribute('data-letter') === activeLetter);
    });
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
    document.getElementById('navCounter').textContent = String(current + 1).padStart(2, '0') + ' / ' + slides.length;
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('zoneLeft').addEventListener('click', prev);
  document.getElementById('zoneRight').addEventListener('click', next);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); show(0); }
    else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
  });

  var touchStartX = null;
  deck.addEventListener('touchstart', function (e) { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
  deck.addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, { passive: true });

  show(0);
})();
